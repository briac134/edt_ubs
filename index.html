<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning — UBS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231F7A6C' width='100' height='100'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='58' fill='white'%3EU%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
:root{--bg:#EEF1F6;--surface:#FFF;--ink:#16233B;--ink-soft:#56607A;--line:#D8DEEA;--accent:#1F7A6C;--accent-soft:#E4F1EE;--today:#C65D2E;--today-soft:#FBEAE1;--shadow:0 12px 35px rgba(22,35,59,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}.shell{max-width:760px;margin:0 auto;padding:40px 20px 64px}header{margin-bottom:25px}h1{font:700 42px/1.1 Fraunces,serif;margin:0}.subtitle{color:var(--ink-soft);margin-top:7px}.controls{display:flex;gap:10px;margin:10px 0}.controls input{flex:1;min-width:0}input,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:var(--surface);color:var(--ink)}button{background:var(--accent);border-color:var(--accent);color:white;font-weight:600;cursor:pointer}button.secondary{background:transparent;color:var(--ink-soft)}button:hover{filter:brightness(.95)}.proxy-help{font-size:13px;color:var(--ink-soft);margin:12px 2px 20px}.proxy-help code{background:var(--accent-soft);padding:2px 4px;border-radius:4px}details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:18px 0;padding:14px 16px;box-shadow:var(--shadow)}summary{cursor:pointer;font-weight:600}.form-row{display:flex;gap:12px;margin-top:14px}.form-group{flex:1;display:flex;flex-direction:column;gap:5px}.form-group label{font-size:13px;color:var(--ink-soft)}.form-actions{margin-top:14px}.theme-panel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 20px;color:var(--ink-soft);font-size:14px}.theme-panel input[type=color]{width:38px;height:36px;padding:3px;cursor:pointer}.theme-panel button{padding:8px 11px;font-size:13px}.theme-panel select{padding:8px 10px}.status{min-height:24px;color:var(--ink-soft);font-size:14px;margin:14px 0}.status.error{color:#a52f24}.day{margin:22px 0}.day-heading{display:flex;align-items:baseline;gap:9px;border-bottom:2px solid var(--line);padding-bottom:7px}.day-heading strong{font:600 22px Fraunces,serif}.day-heading span{color:var(--ink-soft);font-size:14px}.day.today .day-heading{color:var(--today);border-color:var(--today)}.event{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:start;padding:15px 0;border-bottom:1px solid var(--line)}.event-time{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}.event-title{font-weight:600}.event-meta{font-size:13px;color:var(--ink-soft);margin-top:5px}.event-delete{background:transparent;color:var(--ink-soft);border:0;padding:2px 5px;font-size:18px}.empty{background:var(--surface);padding:24px;border-radius:12px;color:var(--ink-soft);text-align:center}@media(max-width:560px){.shell{padding-top:28px}h1{font-size:36px}.controls,.form-row{flex-direction:column}.event{grid-template-columns:70px 1fr auto;gap:8px}}
</style>
</head>
<body><div class="shell">
<header><h1>Mon planning</h1><div class="subtitle">Université Bretagne Sud</div></header>
<div class="controls"><input type="url" id="icsUrl" placeholder="Lien ICS UBS (anonymous_cal.jsp?data=...)" autocomplete="off"><button id="loadBtn" type="button">Charger</button><button id="clearBtn" class="secondary" type="button">Oublier</button></div>
<div class="controls"><input type="url" id="customProxy" placeholder="Proxy facultatif — ex. https://mon-proxy.example/?url=" autocomplete="off"></div>
<p class="proxy-help">Le proxy par défaut est prérempli. Le chargement direct nécessite CORS ; vous pouvez le remplacer par un proxy qui accepte <code>?url=URL_ENCODEE</code> et renvoie le calendrier ICS avec CORS.</p>
<div class="theme-panel"><strong>Thème</strong><select id="themePreset" aria-label="Thème"><option value="ubs">UBS</option><option value="ocean">Océan</option><option value="lavender">Lavande</option><option value="sunset">Coucher de soleil</option><option value="custom">Personnalisé</option></select><label for="accentColor">Accent</label><input id="accentColor" type="color" title="Couleur d'accent"><label for="backgroundColor">Fond</label><input id="backgroundColor" type="color" title="Couleur du fond"><button id="resetTheme" type="button" class="secondary">Réinitialiser</button></div>
<details><summary>➕ Ajouter un événement personnalisé</summary><div><form id="addEventForm"><div class="form-row"><div class="form-group"><label for="eventDate">Date *</label><input type="date" id="eventDate" required></div><div class="form-group"><label for="eventName">Nom de l'événement *</label><input type="text" id="eventName" required></div></div><div class="form-row"><div class="form-group"><label for="eventStart">Heure début *</label><input type="time" id="eventStart" required></div><div class="form-group"><label for="eventEnd">Heure fin *</label><input type="time" id="eventEnd" required></div></div><div class="form-row"><div class="form-group"><label for="eventLocation">Lieu</label><input type="text" id="eventLocation" placeholder="Ex: Amphi 101"></div></div><div class="form-actions"><button type="submit">Ajouter l'événement</button></div></form></div></details>
<div id="status" class="status" role="status" aria-live="polite"></div><div id="agenda"></div>
</div><script>
'use strict';
const DEFAULT_PROXY='https://wispy-flower-3683.briac8151.workers.dev/';
const statusEl=document.getElementById('status'),agendaEl=document.getElementById('agenda'),urlInput=document.getElementById('icsUrl'),proxyInput=document.getElementById('customProxy');
const DAY_NAMES=['dim','lun','mar','mer','jeu','ven','sam'],MONTH_NAMES=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const RANGE_DAYS=60,MAX_OCCURRENCES=10000;
function setStatus(message,error=false){statusEl.textContent=message;statusEl.className='status'+(error?' error':'')}
function getCustomEvents(){try{const v=localStorage.getItem('planning_customEvents');const e=v?JSON.parse(v):[];return Array.isArray(e)?e:[]}catch{return[]}}
function saveCustomEvents(e){localStorage.setItem('planning_customEvents',JSON.stringify(e))}
function localDate(date,time){const p=date.split('-').map(Number),c=time.split(':').map(Number);return new Date(p[0],p[1]-1,p[2],c[0],c[1])}
function customEventsToObjects(){return getCustomEvents().map(e=>({...e,start:localDate(e.date,e.startTime),end:localDate(e.date,e.endTime),summary:e.summary||'Événement personnalisé'}))}
function buildTarget(url,proxy){if(!proxy)return url;try{if(proxy.includes('{url}'))return proxy.replace('{url}',encodeURIComponent(url));const u=new URL(proxy);u.searchParams.set('url',url);return u.toString()}catch{return proxy+encodeURIComponent(url)}}
async function fetchICS(url,proxy){const targets=[{label:'accès direct',url},{label:'proxy',url:buildTarget(url,proxy)}];let error;for(const t of targets){try{setStatus('Chargement via '+t.label+'…');const r=await fetch(t.url,{cache:'no-store',redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}catch(e){error=e}}throw error||new Error('Échec du chargement')}
function expandEvents(text,start,end){const out=[];const component=new ICAL.Component(ICAL.parse(text));for(const vevent of component.getAllSubcomponents('vevent')){const e=new ICAL.Event(vevent),base=e.startDate.toJSDate();if(e.isRecurring()){for(const d of e.iterator(start,end);){const s=d.toJSDate(),duration=e.duration?e.duration.toSeconds()*1000:3600000;out.push({start:s,end:new Date(s.getTime()+duration),summary:e.summary||'Sans titre',location:e.location||''});if(out.length>=MAX_OCCURRENCES)break}}else{const s=base,endDate=e.endDate?e.endDate.toJSDate():new Date(s.getTime()+3600000);if(endDate>=start&&s<=end)out.push({start:s,end:endDate,summary:e.summary||'Sans titre',location:e.location||''})}}return out}
function formatTime(d){return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}function sameDay(a,b){return a.toDateString()===b.toDateString()}
function render(events){agendaEl.replaceChildren();if(!events.length){agendaEl.append(Object.assign(document.createElement('div'),{className:'empty',textContent:'Aucun événement dans la période affichée.'}));return}const today=new Date();let current='';for(const e of events.sort((a,b)=>a.start-b.start)){const key=e.start.toDateString();if(key!==current){current=key;const day=document.createElement('section');day.className='day'+(sameDay(e.start,today)?' today':'');const h=document.createElement('div');h.className='day-heading';const strong=document.createElement('strong');strong.textContent=DAY_NAMES[e.start.getDay()];const span=document.createElement('span');span.textContent=e.start.getDate()+' '+MONTH_NAMES[e.start.getMonth()];h.append(strong,span);day.append(h);agendaEl.append(day)}const day=agendaEl.lastElementChild,item=document.createElement('div');item.className='event';const time=document.createElement('div');time.className='event-time';time.textContent=formatTime(e.start)+'–'+formatTime(e.end);const body=document.createElement('div'),title=document.createElement('div');title.className='event-title';title.textContent=e.summary;body.append(title);if(e.location){const meta=document.createElement('div');meta.className='event-meta';meta.textContent='📍 '+e.location;body.append(meta)}item.append(time,body);if(e.id){const del=document.createElement('button');del.className='event-delete';del.type='button';del.title='Supprimer';del.textContent='×';del.onclick=()=>{saveCustomEvents(getCustomEvents().filter(x=>x.id!==e.id));loadWithCustom()};item.append(del)}else item.append(document.createElement('span'));day.append(item)}}
function getRange(){const n=new Date(),start=new Date(n.getFullYear(),n.getMonth(),n.getDate()),end=new Date(start);end.setDate(end.getDate()+RANGE_DAYS);end.setHours(23,59,59,999);return{start,end}}
function loadWithCustom(){const r=getRange();render(customEventsToObjects().filter(e=>e.start<=r.end&&e.end>=r.start));setStatus('Événements personnalisés affichés.')}
async function load(){const url=urlInput.value.trim();if(!url){loadWithCustom();return}try{new URL(url);localStorage.setItem('planning_icsUrl',url);localStorage.setItem('planning_customProxy',proxyInput.value.trim());const r=getRange(),events=expandEvents(await fetchICS(url,proxyInput.value.trim()),r.start,r.end);render(events.concat(customEventsToObjects().filter(e=>e.start<=r.end&&e.end>=r.start)));setStatus(events.length+' événement(s) chargé(s).')}catch(e){setStatus('Impossible de charger le calendrier : '+e.message,true)}}
document.getElementById('loadBtn').onclick=load;document.getElementById('clearBtn').onclick=()=>{localStorage.removeItem('planning_icsUrl');urlInput.value='';loadWithCustom()};document.getElementById('addEventForm').onsubmit=e=>{e.preventDefault();const date=eventDate.value,start=eventStart.value,end=eventEnd.value;if(end<=start){setStatus('L’heure de fin doit être après l’heure de début.',true);return}const events=getCustomEvents();events.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',date,startTime:start,endTime:end,summary:eventName.value.trim(),location:eventLocation.value.trim()});saveCustomEvents(events);e.target.reset();loadWithCustom()};
const themes={ubs:['#1F7A6C','#EEF1F6'],ocean:['#1769AA','#EAF4FB'],lavender:['#7651A8','#F3F0FA'],sunset:['#C65D2E','#FFF1E9']};function applyTheme(accent,bg,preset){document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--bg',bg);document.documentElement.style.setProperty('--accent-soft',accent+'20');accentColor.value=accent;backgroundColor.value=bg;if(preset)themePreset.value=preset;localStorage.setItem('planning_theme',JSON.stringify({accent,bg,preset:preset||'custom'}))}themePreset.onchange=()=>{if(themes[themePreset.value])applyTheme(...themes[themePreset.value],themePreset.value)};accentColor.oninput=()=>applyTheme(accentColor.value,backgroundColor.value);backgroundColor.oninput=()=>applyTheme(accentColor.value,backgroundColor.value);resetTheme.onclick=()=>{localStorage.removeItem('planning_theme');applyTheme(...themes.ubs,'ubs')};
const savedTheme=JSON.parse(localStorage.getItem('planning_theme')||'null');savedTheme?applyTheme(savedTheme.accent,savedTheme.bg,savedTheme.preset):applyTheme(...themes.ubs,'ubs');urlInput.value=localStorage.getItem('planning_icsUrl')||'';proxyInput.value=localStorage.getItem('planning_customProxy')||DEFAULT_PROXY;if(urlInput.value)load();else loadWithCustom();
</script></body></html>
