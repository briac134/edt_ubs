<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning — UBS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231F7A6C' width='100' height='100'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='54' fill='white'%3EUBS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
:root{--bg:#EEF1F6;--surface:#FFF;--ink:#16233B;--ink-soft:#56607A;--line:#D8DEEA;--accent:#1F7A6C;--accent-soft:#E4F1EE;--today:#C65D2E;--today-soft:#FBEAE1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}.shell{max-width:760px;margin:0 auto;padding:40px 20px 80px}header{margin-bottom:28px}h1{font-family:Fraunces,serif;font-weight:600;font-size:2rem;margin:0;letter-spacing:-.01em}.subtitle{color:var(--ink-soft);font-size:.9rem;margin-top:4px}.controls{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.proxy-help{color:var(--ink-soft);font-size:.78rem;margin:0 0 24px}.controls input{flex:1;min-width:220px}input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:400 .85rem 'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--surface)}button{padding:10px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:500 .85rem 'IBM Plex Sans',sans-serif;cursor:pointer}button:hover{opacity:.9}button.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}details{margin-bottom:20px}details summary{cursor:pointer;color:var(--ink-soft);font-size:.85rem;font-weight:500;padding:8px 0;user-select:none}details summary:hover{color:var(--accent)}details>div{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}.add-event-form{display:grid;gap:12px;margin-bottom:20px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-row.full{grid-template-columns:1fr}.form-group{display:flex;flex-direction:column;gap:4px}.form-group label{font-size:.8rem;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}.form-actions{display:flex;justify-content:flex-end}#status{color:var(--ink-soft);font-size:.85rem;margin-bottom:20px;min-height:1.2em}#status.error{color:var(--today)}.day-block{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}.day-block:last-child{border-bottom:1px solid var(--line)}.day-label{text-align:center}.day-num{font-family:Fraunces,serif;font-size:1.9rem;font-weight:600;line-height:1}.day-name{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-top:2px}.day-block.today .day-num,.day-block.today .day-name{color:var(--today)}.events{display:flex;flex-direction:column;gap:12px}.event{padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;position:relative}.event.custom{border-left-color:#7B61FF;background:#F0EBFF}.day-block.today .event{border-left-color:var(--today);background:var(--today-soft)}.event-time{font-size:.75rem;color:var(--ink-soft);font-weight:500}.event-title{font-weight:600;margin:2px 0}.event-meta{font-size:.8rem;color:var(--ink-soft);white-space:pre-line}.event-delete-btn{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--ink-soft);font-size:1.2rem;padding:0;width:24px;height:24px}.event-delete-btn:hover{color:var(--today)}.empty,.loading{color:var(--ink-soft);font-size:.9rem;padding:20px 0}@media(max-width:560px){.form-row{grid-template-columns:1fr}.controls input{min-width:100%}}
</style>
</head>
<body>
<div class="shell">
<header><h1>Mon planning</h1><div class="subtitle">Université Bretagne Sud</div></header>
<div class="controls">
<input type="url" id="icsUrl" placeholder="Lien ICS UBS (anonymous_cal.jsp?data=...)" autocomplete="off">
<button id="loadBtn" type="button">Charger</button><button id="clearBtn" class="secondary" type="button">Oublier</button>
</div>
<div class="controls">
<input type="url" id="customProxy" placeholder="Proxy facultatif — ex. https://mon-proxy.example/?url=" autocomplete="off">
</div>
<p class="proxy-help">Le chargement direct nécessite CORS. Si UBS le bloque, indiquez un proxy qui accepte <code>?url=URL_ENCODEE</code> et renvoie le calendrier ICS avec CORS.</p>
<details><summary>➕ Ajouter un événement personnalisé</summary><div><form class="add-event-form" id="addEventForm">
<div class="form-row"><div class="form-group"><label for="eventDate">Date *</label><input type="date" id="eventDate" required></div><div class="form-group"><label for="eventName">Nom de l'événement *</label><input type="text" id="eventName" placeholder="Ex: Réunion projet" required></div></div>
<div class="form-row"><div class="form-group"><label for="eventStart">Heure début *</label><input type="time" id="eventStart" required></div><div class="form-group"><label for="eventEnd">Heure fin *</label><input type="time" id="eventEnd" required></div></div>
<div class="form-row full"><div class="form-group"><label for="eventLocation">Lieu</label><input type="text" id="eventLocation" placeholder="Ex: Amphi 101"></div></div>
<div class="form-actions"><button type="submit">Ajouter l'événement</button></div></form></div></details>
<div id="status" role="status" aria-live="polite"></div><div id="agenda"></div>
</div>
<script>
'use strict';
const statusEl=document.getElementById('status'),agendaEl=document.getElementById('agenda'),urlInput=document.getElementById('icsUrl'),proxyInput=document.getElementById('customProxy');
const DAY_NAMES=['dim','lun','mar','mer','jeu','ven','sam'],MONTH_NAMES=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const RANGE_DAYS=60,MAX_OCCURRENCES=10000;
function setStatus(message,error=false){statusEl.textContent=message;statusEl.className=error?'error':''}
function getCustomEvents(){try{const value=localStorage.getItem('planning_customEvents');const events=value?JSON.parse(value):[];return Array.isArray(events)?events:[]}catch{localStorage.removeItem('planning_customEvents');return[]}}
function saveCustomEvents(events){localStorage.setItem('planning_customEvents',JSON.stringify(events))}
function addCustomEvent(date,startTime,endTime,summary,location){const events=getCustomEvents();const id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();events.push({id,date,startTime,endTime,summary,location});saveCustomEvents(events)}
function deleteCustomEvent(id){saveCustomEvents(getCustomEvents().filter(event=>event.id!==id))}
function localDate(date,time){const parts=date.split('-').map(Number),clock=time.split(':').map(Number);return new Date(parts[0],parts[1]-1,parts[2],clock[0],clock[1])}
function customEventsToObjects(){return getCustomEvents().map(event=>{const start=localDate(event.date,event.startTime),end=localDate(event.date,event.endTime);return {...event,start,end,summary:event.summary||'Sans titre',location:event.location||'',description:'',custom:true}}).filter(event=>Number.isFinite(event.start.getTime())&&Number.isFinite(event.end.getTime()))}
function buildTargets(url,proxy){const targets=[{label:'accès direct',target:url}];if(proxy){try{const value=proxy.includes('{url}')?proxy.replace('{url}',encodeURIComponent(url)):new URL(proxy).toString()+ (proxy.includes('?')?'&':'?')+'url='+encodeURIComponent(url);targets.push({label:'proxy personnel',target:value})}catch{throw new Error('URL du proxy invalide')}}return targets}
async function fetchICS(url,proxy,onAttempt){let lastError=null;for(const item of buildTargets(url,proxy)){try{onAttempt(item.label);const response=await fetch(item.target,{cache:'no-store',redirect:'follow'});if(!response.ok)throw new Error('HTTP '+response.status);const text=await response.text();if(!/^\s*BEGIN:VCALENDAR/m.test(text))throw new Error('réponse inattendue (pas un ICS)');return text}catch(error){lastError=error}}throw lastError||new Error('aucune source configurée')}
function expandEvents(icsText,rangeStart,rangeEnd){const results=[];try{const component=new ICAL.Component(ICAL.parse(icsText));for(const vevent of component.getAllSubcomponents('vevent')){const event=new ICAL.Event(vevent),summary=event.summary||'Sans titre',location=event.location||'',description=event.description||'';if(event.isRecurring()){const iterator=event.iterator();let next,count=0;while((next=iterator.next())&&++count<=MAX_OCCURRENCES){const start=next.toJSDate();if(start>rangeEnd)break;if(start<rangeStart)continue;const details=event.getOccurrenceDetails(next);results.push({start:details.startDate.toJSDate(),end:details.endDate.toJSDate(),summary,location,description})}}else if(event.startDate&&event.endDate){const start=event.startDate.toJSDate(),end=event.endDate.toJSDate();if(start<=rangeEnd&&end>=rangeStart)results.push({start,end,summary,location,description})}}}catch(error){throw new Error('calendrier ICS invalide ('+error.message+')')}return results.sort((a,b)=>a.start-b.start)}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function formatTime(date){return date.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
const TEACHER_LINE=/^[A-ZÀ-ÖØ-Ý][\wÀ-ÖØ-öø-ÿ'’-]*(?:\s[A-ZÀ-ÖØ-Ý][\wÀ-ÖØ-öø-ÿ'’-]*)*\s[A-ZÀ-ÖØ-Ý]\.$/;
function parseDescription(description,summary){const teachers=[],extra=[];String(description||'').replace(/\r\n?/g,'\n').split('\n').map(line=>line.trim()).filter(Boolean).forEach(line=>{if(!/^\(Exported/i.test(line)&&line!==summary)(TEACHER_LINE.test(line)?teachers:extra).push(line)});return{teachers,extra}}
function textElement(tag,text,className){const element=document.createElement(tag);if(className)element.className=className;element.textContent=text;return element}
function render(events){agendaEl.replaceChildren();if(!events.length){agendaEl.appendChild(textElement('div','Aucun événement dans la période affichée.','empty'));return}const today=new Date();let currentDay=null,eventsWrap=null;for(const event of events){if(!currentDay||!sameDay(currentDay,event.start)){currentDay=event.start;const block=document.createElement('div');block.className='day-block'+(sameDay(currentDay,today)?' today':'');const label=document.createElement('div');label.className='day-label';label.append(textElement('div',String(currentDay.getDate()),'day-num'),textElement('div',DAY_NAMES[currentDay.getDay()]+' '+MONTH_NAMES[currentDay.getMonth()],'day-name'));eventsWrap=document.createElement('div');eventsWrap.className='events';block.append(label,eventsWrap);agendaEl.appendChild(block)}const card=document.createElement('div');card.className='event'+(event.custom?' custom':'');card.appendChild(textElement('div',formatTime(event.start)+' – '+formatTime(event.end),'event-time'));card.appendChild(textElement('div',event.summary,'event-title'));if(event.location)card.appendChild(textElement('div',event.location,'event-meta'));const parsed=parseDescription(event.description,event.summary);if(parsed.teachers.length){const teacher=textElement('div',parsed.teachers.join(', '),'event-meta');teacher.style.fontWeight='600';card.appendChild(teacher)}if(event.custom){const button=textElement('button','×','event-delete-btn');button.type='button';button.title='Supprimer';button.addEventListener('click',()=>{if(confirm('Supprimer cet événement ?')){deleteCustomEvent(event.id);loadWithCustom()}});card.appendChild(button)}eventsWrap.appendChild(card)}}
function getRange(){const now=new Date();return{start:new Date(now.getFullYear(),now.getMonth(),now.getDate()),end:new Date(now.getFullYear(),now.getMonth(),now.getDate()+RANGE_DAYS,23,59,59,999)}}
function visibleCustomEvents(range){return customEventsToObjects().filter(event=>event.start<=range.end&&event.end>=range.start)}
async function load(){const url=urlInput.value.trim(),proxy=proxyInput.value.trim();if(!url){setStatus('Colle une URL ICS ci-dessus.',true);return}try{new URL(url)}catch{setStatus('L’URL ICS est invalide.',true);return}localStorage.setItem('planning_icsUrl',url);localStorage.setItem('planning_customProxy',proxy);agendaEl.replaceChildren(textElement('div','Chargement du planning…','loading'));try{const icsText=await fetchICS(url,proxy,label=>setStatus('Tentative : '+label+'…'));const range=getRange(),icsEvents=expandEvents(icsText,range.start,range.end),custom=visibleCustomEvents(range),all=[...icsEvents,...custom].sort((a,b)=>a.start-b.start);render(all);setStatus(`${icsEvents.length} événement(s) du planning + ${custom.length} événement(s) personnalisé(s) affiché(s) (${RANGE_DAYS} prochains jours).`)}catch(error){agendaEl.replaceChildren();setStatus('Échec du chargement : '+error.message+'. Vérifiez l’URL, le CORS ou la configuration du proxy.',true)}}
function loadWithCustom(){const range=getRange(),url=urlInput.value.trim();if(url){load();return}const events=visibleCustomEvents(range).sort((a,b)=>a.start-b.start);render(events);setStatus(`${events.length} événement(s) personnalisé(s) affiché(s) (${RANGE_DAYS} prochains jours).`)}
document.getElementById('loadBtn').addEventListener('click',load);document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.removeItem('planning_icsUrl');localStorage.removeItem('planning_customProxy');urlInput.value='';proxyInput.value='';agendaEl.replaceChildren();setStatus('Liens oubliés. Collez un nouveau lien ICS pour recharger.')});
document.getElementById('addEventForm').addEventListener('submit',async event=>{event.preventDefault();const date=document.getElementById('eventDate').value,start=document.getElementById('eventStart').value,end=document.getElementById('eventEnd').value,summary=document.getElementById('eventName').value.trim(),location=document.getElementById('eventLocation').value.trim();if(!date||!start||!end||!summary){setStatus('Veuillez remplir tous les champs requis (*).',true);return}if(start>=end){setStatus('L’heure de fin doit être après l’heure de début.',true);return}addCustomEvent(date,start,end,summary,location);event.target.reset();await loadWithCustom();setStatus('Événement ajouté avec succès !')});
const savedUrl=localStorage.getItem('planning_icsUrl'),savedProxy=localStorage.getItem('planning_customProxy');if(savedUrl){urlInput.value=savedUrl;if(savedProxy)proxyInput.value=savedProxy;load()}else{loadWithCustom();setStatus('Collez votre lien ICS UBS puis cliquez sur « Charger ».')}
</script>
</body>
</html>
