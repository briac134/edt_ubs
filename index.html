<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning — UBS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231F7A6C' width='100' height='100'/><text x='50' y='65' font-size='70' font-weight='bold' text-anchor='middle' fill='white' font-family='serif'>P</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
  :root{
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --ink: #16233B;
    --ink-soft: #56607A;
    --line: #D8DEEA;
    --accent: #1F7A6C;
    --accent-soft: #E4F1EE;
    --today: #C65D2E;
    --today-soft: #FBEAE1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:0.9rem;
    margin-top:4px;
  }
  .controls{
    display:flex;
    gap:8px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  input[type=text], input[type=date], input[type=time]{
    flex:1;
    min-width:220px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.85rem;
    color:var(--ink);
    background:var(--surface);
  }
  button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    background:var(--accent);
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:500;
    font-size:0.85rem;
    cursor:pointer;
  }
  button:hover{ opacity:0.9; }
  button.secondary{
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
  }
  details{
    margin-bottom:20px;
  }
  details summary{
    cursor:pointer;
    color:var(--ink-soft);
    font-size:0.85rem;
    font-weight:500;
    padding:8px 0;
    user-select:none;
  }
  details summary:hover{
    color:var(--accent);
  }
  details > div{
    margin-top:12px;
    padding:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
  }
  #customProxy{
    width:100%;
  }
  .add-event-form{
    display:grid;
    gap:12px;
    margin-bottom:20px;
  }
  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .form-row.full{
    grid-template-columns:1fr;
  }
  .form-group{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .form-group label{
    font-size:0.8rem;
    font-weight:500;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .form-group input{
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.85rem;
    color:var(--ink);
    background:var(--surface);
  }
  .form-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  button.delete-event{
    background:#E8564A;
    font-size:0.75rem;
    padding:6px 10px;
  }
  button.delete-event:hover{
    opacity:0.85;
  }
  #status{
    color:var(--ink-soft);
    font-size:0.85rem;
    margin-bottom:20px;
    min-height:1.2em;
  }
  #status.error{ color:var(--today); }
  .day-block{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:16px;
    padding:20px 0;
    border-top:1px solid var(--line);
  }
  .day-block:last-child{ border-bottom:1px solid var(--line); }
  .day-label{
    text-align:center;
  }
  .day-num{
    font-family:'Fraunces', serif;
    font-size:1.9rem;
    font-weight:600;
    line-height:1;
  }
  .day-name{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .day-block.today .day-num{ color:var(--today); }
  .day-block.today .day-name{ color:var(--today); }
  .events{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .event{
    padding:10px 14px;
    border-left:3px solid var(--accent);
    background:var(--accent-soft);
    border-radius:0 6px 6px 0;
    position:relative;
  }
  .event.custom{
    border-left-color:#7B61FF;
    background:#F0EBFF;
  }
  .day-block.today .event{
    border-left-color:var(--today);
    background:var(--today-soft);
  }
  .event-time{
    font-size:0.75rem;
    color:var(--ink-soft);
    font-weight:500;
  }
  .event-title{
    font-weight:600;
    margin:2px 0;
  }
  .event-meta{
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .event-delete-btn{
    position:absolute;
    top:8px;
    right:8px;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:1.2rem;
    padding:0;
    width:24px;
    height:24px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .event-delete-btn:hover{
    color:var(--today);
  }
  .empty, .loading{
    color:var(--ink-soft);
    font-size:0.9rem;
    padding:20px 0;
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Mon planning</h1>
      <div class="subtitle">
        Université Bretagne Sud<br>
        <strong>Comment utiliser: https://github.com/briac134/edt_ubs/</strong><br>
      </div>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="icsUrl" placeholder="Colle ici ton lien ICS du planning UBS (anonymous_cal.jsp?data=...)">
    <button id="loadBtn">Charger</button>
    <button id="clearBtn" class="secondary" title="Oublier le lien enregistré">Oublier</button>
  </div>

  <input type="hidden" id="customProxy">

  <details>
    <summary>➕ Ajouter un événement personnalisé</summary>
    <div>
      <form class="add-event-form" id="addEventForm">
        <div class="form-row">
          <div class="form-group">
            <label for="eventDate">Date *</label>
            <input type="date" id="eventDate" required>
          </div>
          <div class="form-group">
            <label for="eventName">Nom de l'événement *</label>
            <input type="text" id="eventName" placeholder="Ex: Réunion projet" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eventStart">Heure début *</label>
            <input type="time" id="eventStart" required>
          </div>
          <div class="form-group">
            <label for="eventEnd">Heure fin *</label>
            <input type="time" id="eventEnd" required>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label for="eventLocation">Lieu</label>
            <input type="text" id="eventLocation" placeholder="Ex: Amphi 101">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Ajouter l'événement</button>
        </div>
      </form>
    </div>
  </details>

  <div id="status"></div>
  <div id="agenda"></div>
</div>

<script>
const statusEl = document.getElementById('status');
const agendaEl = document.getElementById('agenda');
const urlInput = document.getElementById('icsUrl');

const DAY_NAMES = ['dim','lun','mar','mer','jeu','ven','sam'];
const MONTH_NAMES = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

function setStatus(msg, isError=false){
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

// Gestion des événements personnalisés
function getCustomEvents(){
  const stored = localStorage.getItem('planning_customEvents');
  return stored ? JSON.parse(stored) : [];
}

function saveCustomEvents(events){
  localStorage.setItem('planning_customEvents', JSON.stringify(events));
}

function addCustomEvent(date, startTime, endTime, summary, location){
  const events = getCustomEvents();
  const id = Date.now().toString();
  events.push({
    id,
    date,
    startTime,
    endTime,
    summary,
    location
  });
  saveCustomEvents(events);
  return id;
}

function deleteCustomEvent(id){
  const events = getCustomEvents();
  const filtered = events.filter(e => e.id !== id);
  saveCustomEvents(filtered);
}

function customEventsToObjects(){
  const customEvents = getCustomEvents();
  return customEvents.map(ev => {
    const [hours, mins] = ev.startTime.split(':');
    const [endHours, endMins] = ev.endTime.split(':');
    const date = new Date(ev.date);
    const start = new Date(date.getFullYear(), date.getMonth(), date.getDate(), parseInt(hours), parseInt(mins));
    const end = new Date(date.getFullYear(), date.getMonth(), date.getDate(), parseInt(endHours), parseInt(endMins));
    return {
      start,
      end,
      summary: ev.summary,
      location: ev.location,
      custom: true,
      id: ev.id
    };
  });
}

// Chaîne de repli : proxy personnel (si renseigné) → accès direct → proxys publics.
function buildTargets(url, customProxyBase){
  const enc = encodeURIComponent(url);
  const targets = [];
  if(customProxyBase){
    targets.push({ label: 'proxy personnel', target: customProxyBase + enc });
  }
  return targets;
}

async function fetchICS(url, customProxyBase, onAttempt){
  const targets = buildTargets(url, customProxyBase);
  let lastError = null;

  for(const { label, target } of targets){
    try{
      onAttempt(label);
      const res = await fetch(target, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if(!text.includes('BEGIN:VCALENDAR')) throw new Error('réponse inattendue (pas un ICS)');
      return text;
    } catch(err){
      lastError = err;
      // on essaie la cible suivante
    }
  }
  throw lastError || new Error('toutes les tentatives ont échoué');
}

function expandEvents(icsText, rangeStart, rangeEnd){
  const jcalData = ICAL.parse(icsText);
  const comp = new ICAL.Component(jcalData);
  const vevents = comp.getAllSubcomponents('vevent');
  const results = [];

  vevents.forEach(vevent => {
    const event = new ICAL.Event(vevent);
    const summary = event.summary || 'Sans titre';
    const location = event.location || '';
    const description = event.description || '';

    if(event.isRecurring()){
      const iterator = event.iterator();
      let next;
      while((next = iterator.next())){
        const occStart = next.toJSDate();
        if(occStart > rangeEnd) break;
        if(occStart < rangeStart) continue;
        const details = event.getOccurrenceDetails(next);
        results.push({
          start: details.startDate.toJSDate(),
          end: details.endDate.toJSDate(),
          summary, location, description
        });
      }
    } else {
      const occStart = event.startDate.toJSDate();
      const occEnd = event.endDate.toJSDate();
      if(occStart <= rangeEnd && occEnd >= rangeStart){
        results.push({ start: occStart, end: occEnd, summary, location, description });
      }
    }
  });

  results.sort((a,b) => a.start - b.start);
  return results;
}

function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function formatTime(d){
  return d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

function render(events){
  agendaEl.innerHTML = '';
  if(events.length === 0){
    agendaEl.innerHTML = '<div class="empty">Aucun événement dans la période affichée.</div>';
    return;
  }

  const today = new Date();
  let currentDay = null;
  let dayBlock = null;
  let eventsWrap = null;

  events.forEach(ev => {
    if(!currentDay || !sameDay(currentDay, ev.start)){
      currentDay = ev.start;
      dayBlock = document.createElement('div');
      dayBlock.className = 'day-block' + (sameDay(currentDay, today) ? ' today' : '');

      const label = document.createElement('div');
      label.className = 'day-label';
      label.innerHTML = `
        <div class="day-num">${currentDay.getDate()}</div>
        <div class="day-name">${DAY_NAMES[currentDay.getDay()]} ${MONTH_NAMES[currentDay.getMonth()]}</div>
      `;

      eventsWrap = document.createElement('div');
      eventsWrap.className = 'events';

      dayBlock.appendChild(label);
      dayBlock.appendChild(eventsWrap);
      agendaEl.appendChild(dayBlock);
    }

    const evEl = document.createElement('div');
    evEl.className = 'event' + (ev.custom ? ' custom' : '');
    let deleteBtn = '';
    if(ev.custom){
      deleteBtn = `<button class="event-delete-btn" data-event-id="${ev.id}" title="Supprimer">×</button>`;
    }
    evEl.innerHTML = `
      <div class="event-time">${formatTime(ev.start)} – ${formatTime(ev.end)}</div>
      <div class="event-title">${ev.summary}</div>
      ${ev.location ? `<div class="event-meta">${ev.location}</div>` : ''}
      ${deleteBtn}
    `;
    
    if(ev.custom){
      evEl.querySelector('.event-delete-btn').addEventListener('click', (e) => {
        e.preventDefault();
        if(confirm('Supprimer cet événement ?')){
          deleteCustomEvent(ev.id);
          loadWithCustom();
        }
      });
    }
    
    eventsWrap.appendChild(evEl);
  });
}

async function load(){
  const url = urlInput.value.trim();
  const customProxyBase = document.getElementById('customProxy').value.trim();
  if(!url){ setStatus('Colle une URL ICS ci-dessus.', true); return; }

  // Sauvegarde durable : reste après fermeture de l'onglet ou rechargement.
  localStorage.setItem('planning_icsUrl', url);
  localStorage.setItem('planning_customProxy', customProxyBase);

  agendaEl.innerHTML = '<div class="loading">Chargement du planning…</div>';

  const attempt = async () => fetchICS(url, customProxyBase, (label) => setStatus('Tentative : ' + label + '…'));

  let icsText;
  try{
    icsText = await attempt();
  } catch(firstErr){
    // Échec transitoire possible (401, proxy surchargé...) : on retente une fois après une courte pause.
    setStatus('Premier passage en échec, nouvelle tentative dans 2s…', true);
    await new Promise(r => setTimeout(r, 2000));
    try{
      icsText = await attempt();
    } catch(secondErr){
      agendaEl.innerHTML = '';
      setStatus('Échec de toutes les tentatives (' + secondErr.message + '). Configure un proxy personnel ci-dessus pour un accès fiable, ou clique sur "Charger" pour réessayer.', true);
      return;
    }
  }

  const now = new Date();
  const rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const rangeEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 60);
  const icsEvents = expandEvents(icsText, rangeStart, rangeEnd);
  const customEvents = customEventsToObjects().filter(e => e.start <= rangeEnd && e.end >= rangeStart);
  const allEvents = [...icsEvents, ...customEvents];
  allEvents.sort((a,b) => a.start - b.start);
  render(allEvents);
  setStatus(`${icsEvents.length} événement(s) du planning + ${customEvents.length} événement(s) personnalisé(s) affiché(s) (60 prochains jours).`);
}

async function loadWithCustom(){
  const url = urlInput.value.trim();
  if(!url){
    // Afficher juste les événements personnalisés
    const now = new Date();
    const rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const rangeEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 60);
    const customEvents = customEventsToObjects().filter(e => e.start <= rangeEnd && e.end >= rangeStart);
    customEvents.sort((a,b) => a.start - b.start);
    render(customEvents);
    setStatus(`${customEvents.length} événement(s) personnalisé(s) affiché(s) (60 prochains jours).`);
  } else {
    load();
  }
}

document.getElementById('loadBtn').addEventListener('click', load);

document.getElementById('clearBtn').addEventListener('click', () => {
  localStorage.removeItem('planning_icsUrl');
  localStorage.removeItem('planning_customProxy');
  urlInput.value = '';
  document.getElementById('customProxy').value = '';
  agendaEl.innerHTML = '';
  setStatus('Lien oublié. Colle un nouveau lien ICS pour recharger.');
});

document.getElementById('addEventForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const date = document.getElementById('eventDate').value;
  const startTime = document.getElementById('eventStart').value;
  const endTime = document.getElementById('eventEnd').value;
  const summary = document.getElementById('eventName').value.trim();
  const location = document.getElementById('eventLocation').value.trim();

  if(!date || !startTime || !endTime || !summary){
    alert('Veuillez remplir tous les champs requis (*).');
    return;
  }

  if(startTime >= endTime){
    alert('L\'heure de fin doit être après l\'heure de début.');
    return;
  }

  addCustomEvent(date, startTime, endTime, summary, location);
  
  // Réinitialiser le formulaire
  document.getElementById('addEventForm').reset();
  
  // Recharger l'affichage
  loadWithCustom();
  setStatus('Événement ajouté avec succès !');
});

// Restauration du lien enregistré (localStorage), puis chargement automatique si présent.
const savedUrl = localStorage.getItem('planning_icsUrl');
const savedProxy = localStorage.getItem('planning_customProxy');
if(savedUrl){
  urlInput.value = savedUrl;
  if(savedProxy) document.getElementById('customProxy').value = savedProxy;
  load();
} else {
  // Afficher les événements personnalisés même sans URL
  loadWithCustom();
  setStatus('Colle ton lien ICS du planning UBS ci-dessus, puis clique sur "Charger". Il sera ensuite mémorisé automatiquement.');
}
</script>
</body>
</html>
