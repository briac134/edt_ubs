<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning — UBS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231F7A6C' width='100' height='100'/><text x='50' y='65' font-size='55' text-anchor='middle' fill='white'>U</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
  :root{
    --bg:#EEF1F6;--surface:#FFFFFF;--ink:#16233B;--ink-soft:#56607A;
    --line:#D8DEEA;--accent:#1F7A6C;--accent-soft:#E4F1EE;
    --today:#C65D2E;--today-soft:#FBEAE1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .shell{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;margin:0;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-soft);font-size:.9rem;margin-top:4px;}
  .controls{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  input[type=text],input[type=date],input[type=time]{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--surface);}
  button{padding:10px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:.85rem;cursor:pointer;}
  button:hover{opacity:.9;} button.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  details{margin-bottom:20px;} details summary{cursor:pointer;color:var(--ink-soft);font-size:.85rem;font-weight:500;padding:8px 0;user-select:none;} details summary:hover{color:var(--accent);}
  details>div{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;}
  #customProxy{width:100%;}
  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .theme-field{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink-soft);font-size:.85rem;}
  .theme-field input[type=color]{width:42px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;}
  .theme-field select{padding:8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--surface);font:inherit;}
  .theme-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .add-event-form{display:grid;gap:12px;margin-bottom:20px;}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.form-row.full{grid-template-columns:1fr;}
  .form-group{display:flex;flex-direction:column;gap:4px;}.form-group label{font-size:.8rem;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .form-group input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--surface);}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;} button.delete-event{background:#E8564A;font-size:.75rem;padding:6px 10px;} button.delete-event:hover{opacity:.85;}
  #status{color:var(--ink-soft);font-size:.85rem;margin-bottom:20px;min-height:1.2em;} #status.error{color:var(--today);}
  .day-block{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line);}.day-block:last-child{border-bottom:1px solid var(--line);}
  .day-label{text-align:center;}.day-num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;line-height:1;}.day-name{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-top:4px;}
  .day-block.today .day-num,.day-block.today .day-name{color:var(--today);}.events{display:flex;flex-direction:column;gap:12px;}
  .event{padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;position:relative;}.event.custom{border-left-color:#7B61FF;background:#F0EBFF;}.day-block.today .event{border-left-color:var(--today);background:var(--today-soft);}
  .event-time{font-size:.75rem;color:var(--ink-soft);font-weight:500;}.event-title{font-weight:600;margin:2px 0;}.event-meta{font-size:.8rem;color:var(--ink-soft);white-space:pre-line;}
  .event-delete-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1.2rem;padding:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
  .event-delete-btn:hover{color:var(--today);} .empty,.loading{color:var(--ink-soft);font-size:.9rem;padding:20px 0;}
  @media(max-width:520px){.theme-grid,.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="shell">
  <header><div><h1>Mon planning</h1><div class="subtitle">Université Bretagne Sud<br><strong>Comment utiliser: https://github.com/briac134/edt_ubs/</strong><br></div></div></header>
  <div class="controls"><input type="text" id="icsUrl" placeholder="Colle ici ton lien ICS du planning UBS (anonymous_cal.jsp?data=...)"><button id="loadBtn">Charger</button><button id="clearBtn" class="secondary" title="Oublier le lien enregistré">Oublier</button></div>
  <input type="hidden" id="customProxy">

  <details id="themeDetails">
    <summary>🎨 Personnaliser le thème et les couleurs</summary>
    <div>
      <div class="theme-grid">
        <label class="theme-field" for="themePreset">Thème <select id="themePreset"><option value="custom">Personnalisé</option><option value="light">Clair</option><option value="dark">Sombre</option><option value="ocean">Océan</option><option value="sunset">Coucher de soleil</option></select></label>
        <label class="theme-field" for="themeFont">Police <select id="themeFont"><option value="sans">IBM Plex Sans</option><option value="serif">Fraunces</option><option value="system">Système</option></select></label>
        <label class="theme-field">Arrière-plan <input type="color" id="colorBg"></label>
        <label class="theme-field">Surface <input type="color" id="colorSurface"></label>
        <label class="theme-field">Texte <input type="color" id="colorInk"></label>
        <label class="theme-field">Accent <input type="color" id="colorAccent"></label>
        <label class="theme-field">Aujourd'hui <input type="color" id="colorToday"></label>
      </div>
      <div class="theme-actions"><button type="button" class="secondary" id="resetThemeBtn">Réinitialiser</button></div>
    </div>
  </details>

  <details><summary>➕ Ajouter un événement personnalisé</summary><div><form class="add-event-form" id="addEventForm">
    <div class="form-row"><div class="form-group"><label for="eventDate">Date *</label><input type="date" id="eventDate" required></div><div class="form-group"><label for="eventName">Nom de l'événement *</label><input type="text" id="eventName" placeholder="Ex: Réunion projet" required></div></div>
    <div class="form-row"><div class="form-group"><label for="eventStart">Heure début *</label><input type="time" id="eventStart" required></div><div class="form-group"><label for="eventEnd">Heure fin *</label><input type="time" id="eventEnd" required></div></div>
    <div class="form-row full"><div class="form-group"><label for="eventLocation">Lieu</label><input type="text" id="eventLocation" placeholder="Ex: Amphi 101"></div></div>
    <div class="form-actions"><button type="submit">Ajouter l'événement</button></div>
  </form></div></details>
  <div id="status"></div><div id="agenda"></div>
</div>
<script>
const statusEl=document.getElementById('status'),agendaEl=document.getElementById('agenda'),urlInput=document.getElementById('icsUrl');
const DAY_NAMES=['dim','lun','mar','mer','jeu','ven','sam'],MONTH_NAMES=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const DEFAULT_THEME={bg:'#EEF1F6',surface:'#FFFFFF',ink:'#16233B',inkSoft:'#56607A',line:'#D8DEEA',accent:'#1F7A6C',accentSoft:'#E4F1EE',today:'#C65D2E',todaySoft:'#FBEAE1',font:'sans'};
const THEMES={light:DEFAULT_THEME,dark:{bg:'#18202B',surface:'#253142',ink:'#F1F5F9',inkSoft:'#AAB7C8',line:'#3C4B5F',accent:'#54B9A6',accentSoft:'#23483F',today:'#F08A5D',todaySoft:'#4B302A',font:'sans'},ocean:{bg:'#E5F3F7',surface:'#FDFEFF',ink:'#12304A',inkSoft:'#567188',line:'#BFDDE8',accent:'#0A7FA8',accentSoft:'#DFF4FB',today:'#E67E22',todaySoft:'#FDE8D8',font:'sans'},sunset:{bg:'#FFF3EE',surface:'#FFFDFB',ink:'#3A2A2A',inkSoft:'#7A5D5D',line:'#F1D7D0',accent:'#C65D2E',accentSoft:'#FBEAE1',today:'#A54846',todaySoft:'#FDE2E2',font:'serif'}};
function setStatus(msg,isError=false){statusEl.textContent=msg;statusEl.className=isError?'error':'';}
function applyTheme(theme,save=true){const root=document.documentElement;Object.entries(theme).forEach(([key,value])=>{if(key!=='font')root.style.setProperty('--'+key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),value);});document.body.style.fontFamily=theme.font==='serif'?'Fraunces, serif':theme.font==='system'?'system-ui, sans-serif':'IBM Plex Sans, sans-serif';document.querySelector('h1').style.fontFamily=theme.font==='serif'?'Fraunces, serif':theme.font==='system'?'system-ui, sans-serif':'Fraunces, serif';if(save)localStorage.setItem('planning_theme',JSON.stringify(theme));syncThemeInputs(theme);}
function syncThemeInputs(theme){document.getElementById('colorBg').value=theme.bg;document.getElementById('colorSurface').value=theme.surface;document.getElementById('colorInk').value=theme.ink;document.getElementById('colorAccent').value=theme.accent;document.getElementById('colorToday').value=theme.today;document.getElementById('themeFont').value=theme.font||'sans';}
function currentTheme(){const t={...DEFAULT_THEME};[['bg','colorBg'],['surface','colorSurface'],['ink','colorInk'],['accent','colorAccent'],['today','colorToday']].forEach(([key,id])=>t[key]=document.getElementById(id).value);t.font=document.getElementById('themeFont').value;return t;}
function updateCustomTheme(){const t=currentTheme();applyTheme(t);document.getElementById('themePreset').value='custom';}
document.querySelectorAll('#themeDetails input[type=color],#themeFont').forEach(el=>el.addEventListener('input',updateCustomTheme));
document.getElementById('themePreset').addEventListener('change',e=>{if(e.target.value!=='custom')applyTheme({...THEMES[e.target.value]});});
document.getElementById('resetThemeBtn').addEventListener('click',()=>{localStorage.removeItem('planning_theme');applyTheme(DEFAULT_THEME);document.getElementById('themePreset').value='light';});
const savedTheme=localStorage.getItem('planning_theme');applyTheme(savedTheme?{...DEFAULT_THEME,...JSON.parse(savedTheme)}:DEFAULT_THEME,false);
function getCustomEvents(){const stored=localStorage.getItem('planning_customEvents');return stored?JSON.parse(stored):[];}function saveCustomEvents(events){localStorage.setItem('planning_customEvents',JSON.stringify(events));}
function addCustomEvent(date,startTime,endTime,summary,location){const events=getCustomEvents();const id=Date.now().toString();events.push({id,date,startTime,endTime,summary,location});saveCustomEvents(events);return id;}
function deleteCustomEvent(id){saveCustomEvents(getCustomEvents().filter(e=>e.id!==id));}
function customEventsToObjects(){return getCustomEvents().map(ev=>{const [h,m]=ev.startTime.split(':'), [eh,em]=ev.endTime.split(':'), date=new Date(ev.date), start=new Date(date.getFullYear(),date.getMonth(),date.getDate(),h,m), end=new Date(date.getFullYear(),date.getMonth(),date.getDate(),eh,em); return {start,end,summary:ev.summary,location:ev.location,custom:true,id:ev.id};});}
function buildTargets(url,proxy){const targets=[{label:'URL directe',target:url}];if(proxy){targets.push({label:'proxy personnel',target:proxy+encodeURIComponent(url)});}return targets;}
async function fetchICS(url,proxy,onAttempt){let lastError=null;for(const{label,target} of buildTargets(url,proxy)){try{onAttempt(label);const res=await fetch(target,{cache:'no-store'});if(!res.ok) throw new Error('HTTP '+res.status);const text=await res.text();if(!text.includes('BEGIN:VCALENDAR'))throw new Error('Le contenu ne semble pas être un calendrier ICS valide.');return text;}catch(err){lastError=err;}}
throw lastError||new Error('Toutes les tentatives ont échoué.');}
function expandEvents(icsText,rangeStart,rangeEnd){const comp=new ICAL.Component(ICAL.parse(icsText)),results=[];comp.getAllSubcomponents('vevent').forEach(vevent=>{const event=new ICAL.Event(vevent);const summary=event.summary || 'Sans titre';const location=event.location || '';const description=event.description || '';const start=event.startDate.toJSDate();const end=event.endDate.toJSDate();if(end<rangeStart||start>rangeEnd)return;results.push({start,end,summary,location,description,custom:false});});return results.sort((a,b)=>a.start-b.start);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function formatTime(d){return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function render(events){agendaEl.innerHTML='';if(!events.length){agendaEl.innerHTML='<div class="empty">Aucun événement dans la période affichée.</div>';return;}const today=new Date();let currentDay=null;events.forEach(ev=>{if(!currentDay||!sameDay(currentDay,ev.start)){currentDay=ev.start;const dayBlock=document.createElement('div');dayBlock.className='day-block'+(sameDay(currentDay,today)?' today':'');const label=document.createElement('div');label.className='day-label';label.innerHTML='<div class="day-num">'+currentDay.getDate()+'</div><div class="day-name">'+DAY_NAMES[currentDay.getDay()]+'</div>';const eventsWrap=document.createElement('div');eventsWrap.className='events';dayBlock.appendChild(label);dayBlock.appendChild(eventsWrap);agendaEl.appendChild(dayBlock);currentDay=ev.start;currentDay.eventsWrap=eventsWrap;}const evEl=document.createElement('div');evEl.className='event'+(ev.custom?' custom':'');const deleteBtn=document.createElement('button');deleteBtn.type='button';deleteBtn.className='event-delete-btn';deleteBtn.title='Supprimer';deleteBtn.innerHTML='×';if(ev.custom){deleteBtn.addEventListener('click',()=>{deleteCustomEvent(ev.id);loadWithCustom();});}evEl.appendChild(deleteBtn);const timeEl=document.createElement('div');timeEl.className='event-time';timeEl.textContent=formatTime(ev.start)+' – '+formatTime(ev.end);const titleEl=document.createElement('div');titleEl.className='event-title';titleEl.textContent=ev.summary;evEl.appendChild(timeEl);evEl.appendChild(titleEl);if(ev.location){const meta=document.createElement('div');meta.className='event-meta';meta.textContent=ev.location;evEl.appendChild(meta);}const info=ev.description||'';const teacherMatch=info.match(/(?:Prof|Enseignant|Intervenant|CM|TD|TP|Amphi|Salle|Lieu)[:\n].*/gi);if(teacherMatch&&teacherMatch.length){const meta=document.createElement('div');meta.className='event-meta';meta.innerHTML='<strong>'+teacherMatch.join('<br>')+'</strong>';evEl.appendChild(meta);}if(ev.custom){evEl.querySelector('.event-delete-btn').style.display='flex';}currentDay.eventsWrap.appendChild(evEl);});}
async function load(){const url=urlInput.value.trim(),proxy=document.getElementById('customProxy').value.trim();if(!url){setStatus('Colle une URL ICS ci-dessus.',true);return;}localStorage.setItem('planning_icsUrl',url);if(proxy)localStorage.setItem('planning_customProxy',proxy);try{setStatus('Chargement...');const icsText=await fetchICS(url,proxy,label=>setStatus('Tentative: '+label));const now=new Date();const rangeStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());const rangeEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate()+60);const allEvents=[...expandEvents(icsText,rangeStart,rangeEnd),...customEventsToObjects().filter(e=>e.start<=rangeEnd&&e.end>=rangeStart)];allEvents.sort((a,b)=>a.start-b.start);render(allEvents);setStatus(''+allEvents.length+' événement(s) affiché(s).');}catch(err){setStatus('Erreur de chargement: '+(err&&err.message?err.message:'inconnue'),true);}}
async function loadWithCustom(){const url=urlInput.value.trim();if(!url){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+60),events=customEventsToObjects().filter(e=>e.start<=end&&e.end>=start).sort((a,b)=>a.start-b.start);render(events);setStatus(''+events.length+' événement(s) personnalisé(s).');return;}const proxy=document.getElementById('customProxy').value.trim();try{const icsText=await fetchICS(url,proxy,label=>setStatus('Tentative: '+label));const now=new Date();const rangeStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());const rangeEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate()+60);const icsEvents=expandEvents(icsText,rangeStart,rangeEnd);const customEvents=customEventsToObjects().filter(e=>e.start<=rangeEnd&&e.end>=rangeStart);const allEvents=[...icsEvents,...customEvents].sort((a,b)=>a.start-b.start);render(allEvents);setStatus(''+allEvents.length+' événement(s) affiché(s).');}catch(err){setStatus('Erreur de chargement: '+(err&&err.message?err.message:'inconnue'),true);}}
document.getElementById('loadBtn').addEventListener('click',load);document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.removeItem('planning_icsUrl');urlInput.value='';agendaEl.innerHTML='';setStatus('Lien oublié. Colle un nouveau lien ICS pour recharger.');});
document.getElementById('addEventForm').addEventListener('submit',e=>{e.preventDefault();const date=document.getElementById('eventDate').value,start=document.getElementById('eventStart').value,end=document.getElementById('eventEnd').value,summary=document.getElementById('eventName').value.trim(),location=document.getElementById('eventLocation').value.trim();if(!date||!start||!end||!summary){alert('Veuillez remplir tous les champs requis.');return;}if(start>=end){alert("L'heure de fin doit être après l'heure de début.");return;}addCustomEvent(date,start,end,summary,location);e.target.reset();loadWithCustom();setStatus('Événement ajouté avec succès.');});
const savedUrl=localStorage.getItem('planning_icsUrl'),savedProxy=localStorage.getItem('planning_customProxy');if(savedUrl){urlInput.value=savedUrl;if(savedProxy)document.getElementById('customProxy').value=savedProxy;load();}else{loadWithCustom();setStatus('Colle ton lien ICS du planning UBS ci-dessus.');}
</script>
</body>
</html>
