<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning — UBS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231F7A6C' width='100' height='100'/><text x='50' y='65' font-size='55' text-anchor='middle' fill='white'>U</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
  :root{
    --bg:#EEF1F6;--surface:#FFFFFF;--ink:#16233B;--ink-soft:#56607A;
    --line:#D8DEEA;--accent:#1F7A6C;--accent-soft:#E4F1EE;
    --today:#C65D2E;--today-soft:#FBEAE1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .shell{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;margin:0;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-soft);font-size:.9rem;margin-top:4px;}
  .controls{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  input[type=text],input[type=date],input[type=time]{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--surface);}
  button{padding:10px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:.85rem;cursor:pointer;}
  button:hover{opacity:.9;} button.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  details{margin-bottom:20px;} details summary{cursor:pointer;color:var(--ink-soft);font-size:.85rem;font-weight:500;padding:8px 0;user-select:none;} details summary:hover{color:var(--accent);}
  details>div{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;}
  #customProxy{width:100%;}
  .theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .theme-field{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink-soft);font-size:.85rem;}
  .theme-field input[type=color]{width:42px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;}
  .theme-field select{padding:8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--surface);font:inherit;}
  .theme-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .add-event-form{display:grid;gap:12px;margin-bottom:20px;}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.form-row.full{grid-template-columns:1fr;}
  .form-group{display:flex;flex-direction:column;gap:4px;}.form-group label{font-size:.8rem;font-weight:500;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .form-group input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;color:var(--ink);background:var(--surface);}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;} button.delete-event{background:#E8564A;font-size:.75rem;padding:6px 10px;} button.delete-event:hover{opacity:.85;}
  #status{color:var(--ink-soft);font-size:.85rem;margin-bottom:20px;min-height:1.2em;} #status.error{color:var(--today);}
  .day-block{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line);}.day-block:last-child{border-bottom:1px solid var(--line);}
  .day-label{text-align:center;}.day-num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;line-height:1;}.day-name{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-top:2px;}
  .day-block.today .day-num,.day-block.today .day-name{color:var(--today);}.events{display:flex;flex-direction:column;gap:12px;}
  .event{padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;position:relative;}.event.custom{border-left-color:#7B61FF;background:#F0EBFF;}.day-block.today .event{border-left-color:var(--today);background:var(--today-soft);}
  .event-time{font-size:.75rem;color:var(--ink-soft);font-weight:500;}.event-title{font-weight:600;margin:2px 0;}.event-meta{font-size:.8rem;color:var(--ink-soft);white-space:pre-line;}
  .event-delete-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1.2rem;padding:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}.event-delete-btn:hover{color:var(--today);}
  .empty,.loading{color:var(--ink-soft);font-size:.9rem;padding:20px 0;}
  @media(max-width:520px){.theme-grid,.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="shell">
  <header><div><h1>Mon planning</h1><div class="subtitle">Université Bretagne Sud<br><strong>Comment utiliser: https://github.com/briac134/edt_ubs/</strong><br></div></div></header>
  <div class="controls"><input type="text" id="icsUrl" placeholder="Colle ici ton lien ICS du planning UBS (anonymous_cal.jsp?data=...)"><button id="loadBtn">Charger</button><button id="clearBtn" class="secondary" title="Oublier le lien enregistré">Oublier</button></div>
  <input type="hidden" id="customProxy">

  <details id="themeDetails">
    <summary>🎨 Personnaliser le thème et les couleurs</summary>
    <div>
      <div class="theme-grid">
        <label class="theme-field" for="themePreset">Thème <select id="themePreset"><option value="custom">Personnalisé</option><option value="light">Clair</option><option value="dark">Sombre</option><option value="ocean">Océan</option><option value="sunset">Coucher de soleil</option></select></label>
        <label class="theme-field" for="themeFont">Police <select id="themeFont"><option value="sans">IBM Plex Sans</option><option value="serif">Fraunces</option><option value="system">Système</option></select></label>
        <label class="theme-field">Arrière-plan <input type="color" id="colorBg"></label>
        <label class="theme-field">Surface <input type="color" id="colorSurface"></label>
        <label class="theme-field">Texte <input type="color" id="colorInk"></label>
        <label class="theme-field">Accent <input type="color" id="colorAccent"></label>
        <label class="theme-field">Aujourd'hui <input type="color" id="colorToday"></label>
      </div>
      <div class="theme-actions"><button type="button" class="secondary" id="resetThemeBtn">Réinitialiser</button></div>
    </div>
  </details>

  <details><summary>➕ Ajouter un événement personnalisé</summary><div><form class="add-event-form" id="addEventForm">
    <div class="form-row"><div class="form-group"><label for="eventDate">Date *</label><input type="date" id="eventDate" required></div><div class="form-group"><label for="eventName">Nom de l'événement *</label><input type="text" id="eventName" placeholder="Ex: Réunion projet" required></div></div>
    <div class="form-row"><div class="form-group"><label for="eventStart">Heure début *</label><input type="time" id="eventStart" required></div><div class="form-group"><label for="eventEnd">Heure fin *</label><input type="time" id="eventEnd" required></div></div>
    <div class="form-row full"><div class="form-group"><label for="eventLocation">Lieu</label><input type="text" id="eventLocation" placeholder="Ex: Amphi 101"></div></div>
    <div class="form-actions"><button type="submit">Ajouter l'événement</button></div>
  </form></div></details>
  <div id="status"></div><div id="agenda"></div>
</div>
<script>
const statusEl=document.getElementById('status'),agendaEl=document.getElementById('agenda'),urlInput=document.getElementById('icsUrl');
const DAY_NAMES=['dim','lun','mar','mer','jeu','ven','sam'],MONTH_NAMES=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const DEFAULT_THEME={bg:'#EEF1F6',surface:'#FFFFFF',ink:'#16233B',inkSoft:'#56607A',line:'#D8DEEA',accent:'#1F7A6C',accentSoft:'#E4F1EE',today:'#C65D2E',todaySoft:'#FBEAE1',font:'sans'};
const THEMES={light:DEFAULT_THEME,dark:{bg:'#18202B',surface:'#253142',ink:'#F1F5F9',inkSoft:'#AAB7C8',line:'#3C4B5F',accent:'#54B9A6',accentSoft:'#23483F',today:'#F08A5D',todaySoft:'#4B302A',font:'sans'},ocean:{bg:'#E5F3F7',surface:'#FFFFFF',ink:'#123044',inkSoft:'#477080',line:'#B9D8E1',accent:'#087E8B',accentSoft:'#D8F0F2',today:'#D45A45',todaySoft:'#FBE3DD',font:'sans'},sunset:{bg:'#FFF3E8',surface:'#FFFDF9',ink:'#432A26',inkSoft:'#86615A',line:'#E9CFC2',accent:'#C45B3C',accentSoft:'#FBE3D8',today:'#7B4FA0',todaySoft:'#EEE3F6',font:'serif'}};
function setStatus(msg,isError=false){statusEl.textContent=msg;statusEl.className=isError?'error':'';}
function applyTheme(theme,save=true){const root=document.documentElement;Object.entries(theme).forEach(([key,value])=>{if(key!=='font')root.style.setProperty('--'+key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),value);});const fonts={sans:"'IBM Plex Sans', sans-serif",serif:"'Fraunces', serif",system:'system-ui, sans-serif'};document.body.style.fontFamily=fonts[theme.font]||fonts.sans;document.querySelector('h1').style.fontFamily=theme.font==='sans'?"'Fraunces', serif":fonts[theme.font]||fonts.serif;if(save)localStorage.setItem('planning_theme',JSON.stringify(theme));syncThemeInputs(theme);}
function syncThemeInputs(theme){document.getElementById('colorBg').value=theme.bg;document.getElementById('colorSurface').value=theme.surface;document.getElementById('colorInk').value=theme.ink;document.getElementById('colorAccent').value=theme.accent;document.getElementById('colorToday').value=theme.today;document.getElementById('themeFont').value=theme.font;}
function currentTheme(){const t={...DEFAULT_THEME};[['bg','colorBg'],['surface','colorSurface'],['ink','colorInk'],['accent','colorAccent'],['today','colorToday']].forEach(([key,id])=>t[key]=document.getElementById(id).value);t.font=document.getElementById('themeFont').value;const hex=(h,amount)=>h; t.accentSoft=DEFAULT_THEME.accentSoft;t.todaySoft=DEFAULT_THEME.todaySoft;t.inkSoft=DEFAULT_THEME.inkSoft;t.line=DEFAULT_THEME.line;return t;}
function updateCustomTheme(){const t=currentTheme();applyTheme(t);document.getElementById('themePreset').value='custom';}
document.querySelectorAll('#themeDetails input[type=color],#themeFont').forEach(el=>el.addEventListener('input',updateCustomTheme));
document.getElementById('themePreset').addEventListener('change',e=>{if(e.target.value!=='custom')applyTheme({...THEMES[e.target.value]});});
document.getElementById('resetThemeBtn').addEventListener('click',()=>{localStorage.removeItem('planning_theme');applyTheme(DEFAULT_THEME);document.getElementById('themePreset').value='light';});
const savedTheme=localStorage.getItem('planning_theme');applyTheme(savedTheme?{...DEFAULT_THEME,...JSON.parse(savedTheme)}:DEFAULT_THEME,false);
function getCustomEvents(){const stored=localStorage.getItem('planning_customEvents');return stored?JSON.parse(stored):[];}function saveCustomEvents(events){localStorage.setItem('planning_customEvents',JSON.stringify(events));}function addCustomEvent(date,startTime,endTime,summary,location){const events=getCustomEvents(),id=Date.now().toString();events.push({id,date,startTime,endTime,summary,location});saveCustomEvents(events);return id;}function deleteCustomEvent(id){saveCustomEvents(getCustomEvents().filter(e=>e.id!==id));}
function customEventsToObjects(){return getCustomEvents().map(ev=>{const[h,m]=ev.startTime.split(':'),[eh,em]=ev.endTime.split(':'),date=new Date(ev.date),start=new Date(date.getFullYear(),date.getMonth(),date.getDate(),+h,+m),end=new Date(date.getFullYear(),date.getMonth(),date.getDate(),+eh,+em);return{start,end,summary:ev.summary,location:ev.location,custom:true,id:ev.id};});}
function buildTargets(url,proxy){return proxy?[{label:'proxy personnel',target:proxy+encodeURIComponent(url)}]:[];}async function fetchICS(url,proxy,onAttempt){let lastError=null;for(const{label,target}of buildTargets(url,proxy)){try{onAttempt(label);const res=await fetch(target,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const text=await res.text();if(!text.includes('BEGIN:VCALENDAR'))throw new Error('réponse inattendue (pas un ICS)');return text;}catch(err){lastError=err;}}throw lastError||new Error('toutes les tentatives ont échoué');}
function expandEvents(icsText,rangeStart,rangeEnd){const comp=new ICAL.Component(ICAL.parse(icsText)),results=[];comp.getAllSubcomponents('vevent').forEach(vevent=>{const event=new ICAL.Event(vevent),summary=event.summary||'Sans titre',location=event.location||'',description=event.description||'';if(event.isRecurring()){const iterator=event.iterator();let next;while((next=iterator.next())){const occStart=next.toJSDate();if(occStart>rangeEnd)break;if(occStart<rangeStart)continue;const details=event.getOccurrenceDetails(next);results.push({start:details.startDate.toJSDate(),end:details.endDate.toJSDate(),summary,location,description});}}else{const start=event.startDate.toJSDate(),end=event.endDate.toJSDate();if(start<=rangeEnd&&end>=rangeStart)results.push({start,end,summary,location,description});}});return results.sort((a,b)=>a.start-b.start);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}function formatTime(d){return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}const TEACHER_LINE=/^[A-ZÀ-ÖØ-Ý][\wÀ-ÖØ-öø-ÿ'’-]*(?:\s[A-ZÀ-ÖØ-Ý][\wÀ-ÖØ-öø-ÿ'’-]*)*\s[A-ZÀ-ÖØ-Ý]\.$/;function parseDescription(description,summary){if(!description)return{teachers:[],extra:[]};const teachers=[],extra=[];description.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{if(/^\(Exported/i.test(line)||line===summary)return;if(TEACHER_LINE.test(line))teachers.push(line);else extra.push(line);});return{teachers,extra};}
function render(events){agendaEl.innerHTML='';if(!events.length){agendaEl.innerHTML='<div class="empty">Aucun événement dans la période affichée.</div>';return;}const today=new Date();let currentDay=null,eventsWrap=null;events.forEach(ev=>{if(!currentDay||!sameDay(currentDay,ev.start)){currentDay=ev.start;const dayBlock=document.createElement('div');dayBlock.className='day-block'+(sameDay(currentDay,today)?' today':'');const label=document.createElement('div');label.className='day-label';label.innerHTML=`<div class="day-num">${currentDay.getDate()}</div><div class="day-name">${DAY_NAMES[currentDay.getDay()]} ${MONTH_NAMES[currentDay.getMonth()]}</div>`;eventsWrap=document.createElement('div');eventsWrap.className='events';dayBlock.append(label,eventsWrap);agendaEl.appendChild(dayBlock);}const evEl=document.createElement('div');evEl.className='event'+(ev.custom?' custom':'');const deleteBtn=ev.custom?`<button class="event-delete-btn" title="Supprimer">×</button>`:'';const{teachers}=parseDescription(ev.description,ev.summary);evEl.innerHTML=`${deleteBtn}<div class="event-time">${formatTime(ev.start)} – ${formatTime(ev.end)}</div><div class="event-title">${ev.summary}</div>${ev.location?`<div class="event-meta">${ev.location}</div>`:''}${teachers.length?`<div class="event-meta"><strong>${teachers.join(', ')}</strong></div>`:''}`;if(ev.custom)evEl.querySelector('.event-delete-btn').addEventListener('click',e=>{e.preventDefault();if(confirm('Supprimer cet événement ?')){deleteCustomEvent(ev.id);loadWithCustom();}});eventsWrap.appendChild(evEl);});}
async function load(){const url=urlInput.value.trim(),proxy=document.getElementById('customProxy').value.trim();if(!url){setStatus('Colle une URL ICS ci-dessus.',true);return;}localStorage.setItem('planning_icsUrl',url);localStorage.setItem('planning_customProxy',proxy);agendaEl.innerHTML='<div class="loading">Chargement du planning…</div>';const attempt=()=>fetchICS(url,proxy,label=>setStatus('Tentative : '+label+'…'));let icsText;try{icsText=await attempt();}catch(firstErr){setStatus('Premier passage en échec, nouvelle tentative dans 2s…',true);await new Promise(r=>setTimeout(r,2000));try{icsText=await attempt();}catch(secondErr){agendaEl.innerHTML='';setStatus('Échec de toutes les tentatives ('+secondErr.message+'). Configure un proxy personnel ci-dessus pour un accès fiable, ou clique sur "Charger" pour réessayer.',true);return;}}const now=new Date(),rangeStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()),rangeEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate()+60),icsEvents=expandEvents(icsText,rangeStart,rangeEnd),customEvents=customEventsToObjects().filter(e=>e.start<=rangeEnd&&e.end>=rangeStart),allEvents=[...icsEvents,...customEvents].sort((a,b)=>a.start-b.start);render(allEvents);setStatus(`${icsEvents.length} événement(s) du planning + ${customEvents.length} événement(s) personnalisé(s) affiché(s) (60 prochains jours).`);}
async function loadWithCustom(){const url=urlInput.value.trim();if(!url){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+60),events=customEventsToObjects().filter(e=>e.start<=end&&e.end>=start).sort((a,b)=>a.start-b.start);render(events);setStatus(`${events.length} événement(s) personnalisé(s) affiché(s) (60 prochains jours).`);}else load();}
document.getElementById('loadBtn').addEventListener('click',load);document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.removeItem('planning_icsUrl');localStorage.removeItem('planning_customProxy');urlInput.value='';document.getElementById('customProxy').value='';agendaEl.innerHTML='';setStatus('Lien oublié. Colle un nouveau lien ICS pour recharger.');});
document.getElementById('addEventForm').addEventListener('submit',e=>{e.preventDefault();const date=document.getElementById('eventDate').value,start=document.getElementById('eventStart').value,end=document.getElementById('eventEnd').value,summary=document.getElementById('eventName').value.trim(),location=document.getElementById('eventLocation').value.trim();if(!date||!start||!end||!summary){alert('Veuillez remplir tous les champs requis (*).');return;}if(start>=end){alert("L'heure de fin doit être après l'heure de début.");return;}addCustomEvent(date,start,end,summary,location);e.target.reset();loadWithCustom();setStatus('Événement ajouté avec succès !');});
const savedUrl=localStorage.getItem('planning_icsUrl'),savedProxy=localStorage.getItem('planning_customProxy');if(savedUrl){urlInput.value=savedUrl;if(savedProxy)document.getElementById('customProxy').value=savedProxy;load();}else{loadWithCustom();setStatus('Colle ton lien ICS du planning UBS ci-dessus, puis clique sur "Charger". Il sera ensuite mémorisé automatiquement.');}
</script>
</body>
</html>
