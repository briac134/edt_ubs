<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon planning — UBS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231F7A6C' width='100' height='100'/><text x='50' y='65' font-size='55' text-anchor='middle' fill='white'>U</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
<style>
:root{--bg:#EEF1F6;--surface:#FFF;--ink:#16233B;--ink-soft:#56607A;--line:#D8DEEA;--accent:#1F7A6C;--accent-soft:#E4F1EE;--today:#C65D2E;--today-soft:#FBEAE1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}.shell{max-width:760px;margin:auto;padding:40px 20px 80px}header{margin-bottom:28px}h1{font-family:Fraunces,serif;margin:0}.subtitle{color:var(--ink-soft);font-size:.9rem;margin-top:4px}.controls{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}input[type=text],input[type=date],input[type=time]{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.85rem;color:var(--ink);background:var(--surface)}button{padding:10px 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:500 .85rem inherit;cursor:pointer}button.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}details{margin-bottom:20px}details summary{cursor:pointer;color:var(--ink-soft);font-size:.85rem;padding:8px 0}details>div{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.theme-field{display:flex;align-items:center;justify-content:space-between;color:var(--ink-soft);font-size:.85rem}.theme-field input[type=color]{width:42px;height:32px}.theme-field select,.form-group input{padding:8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--surface);font:inherit}.theme-actions,.form-actions{display:flex;justify-content:flex-end;margin-top:14px}.add-event-form{display:grid;gap:12px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-row.full{grid-template-columns:1fr}.form-group{display:flex;flex-direction:column;gap:4px}.form-group label{font-size:.8rem;color:var(--ink-soft)}#status{color:var(--ink-soft);font-size:.85rem;margin-bottom:20px;min-height:1.2em}#status.error{color:var(--today)}.day-block{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:20px 0;border-top:1px solid var(--line)}.day-block:last-child{border-bottom:1px solid var(--line)}.day-label{text-align:center}.day-num{font:600 1.9rem Fraunces,serif}.day-name{font-size:.7rem;text-transform:uppercase;color:var(--ink-soft)}.day-block.today .day-num,.day-block.today .day-name{color:var(--today)}.events{display:flex;flex-direction:column;gap:12px}.event{padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;position:relative}.event.custom{border-left-color:#7B61FF;background:#F0EBFF}.day-block.today .event{border-left-color:var(--today);background:var(--today-soft)}.event-time{font-size:.75rem;color:var(--ink-soft)}.event-title{font-weight:600;margin:2px 0}.event-meta{font-size:.8rem;color:var(--ink-soft);white-space:pre-line}.event-delete-btn{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--ink-soft);font-size:1.2rem;padding:0}.empty,.loading{color:var(--ink-soft);padding:20px 0}@media(max-width:520px){.theme-grid,.form-row{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell">
<header><h1>Mon planning</h1><div class="subtitle">Université Bretagne Sud<br><strong>Comment utiliser: https://github.com/briac134/edt_ubs/</strong></div></header>
<div class="controls"><input type="text" id="icsUrl" placeholder="Colle ici ton lien ICS du planning UBS (anonymous_cal.jsp?data=...)"><button id="loadBtn">Charger</button><button id="clearBtn" class="secondary" title="Oublier le lien enregistré">Oublier</button></div>
<input type="hidden" id="customProxy">
<details id="themeDetails"><summary>🎨 Personnaliser le thème et les couleurs</summary><div><div class="theme-grid"><label class="theme-field">Thème <select id="themePreset"><option value="light">Clair</option><option value="dark">Sombre</option></select></label><label class="theme-field">Police <select id="themeFont"><option value="sans">IBM Plex Sans</option><option value="serif">Fraunces</option><option value="system">Système</option></select></label><label class="theme-field">Arrière-plan <input type="color" id="colorBg"></label><label class="theme-field">Surface <input type="color" id="colorSurface"></label><label class="theme-field">Texte <input type="color" id="colorInk"></label><label class="theme-field">Accent <input type="color" id="colorAccent"></label><label class="theme-field">Aujourd'hui <input type="color" id="colorToday"></label></div><div class="theme-actions"><button type="button" class="secondary" id="resetThemeBtn">Réinitialiser</button></div></div></details>
<details><summary>➕ Ajouter un événement personnalisé</summary><div><form class="add-event-form" id="addEventForm"><div class="form-row"><div class="form-group"><label for="eventDate">Date *</label><input type="date" id="eventDate" required></div><div class="form-group"><label for="eventName">Nom de l'événement *</label><input type="text" id="eventName" required></div></div><div class="form-row"><div class="form-group"><label for="eventStart">Heure début *</label><input type="time" id="eventStart" required></div><div class="form-group"><label for="eventEnd">Heure fin *</label><input type="time" id="eventEnd" required></div></div><div class="form-row full"><div class="form-group"><label for="eventLocation">Lieu</label><input type="text" id="eventLocation"></div></div><div class="form-actions"><button type="submit">Ajouter l'événement</button></div></form></div></details>
<div id="status"></div><div id="agenda"></div></div>
<script>
const statusEl=document.getElementById('status'),agendaEl=document.getElementById('agenda'),urlInput=document.getElementById('icsUrl');
const DEFAULT_THEME={bg:'#EEF1F6',surface:'#FFFFFF',ink:'#16233B',inkSoft:'#56607A',line:'#D8DEEA',accent:'#1F7A6C',accentSoft:'#E4F1EE',today:'#C65D2E',todaySoft:'#FBEAE1',font:'sans'};
const DARK_THEME={...DEFAULT_THEME,bg:'#18202B',surface:'#253142',ink:'#F1F5F9',inkSoft:'#AAB7C8',line:'#3C4B5F',accent:'#54B9A6',accentSoft:'#23483F',today:'#F08A5D',todaySoft:'#4B302A'};
function setStatus(msg,error=false){statusEl.textContent=msg;statusEl.className=error?'error':''}function applyTheme(t,save=true){const r=document.documentElement;Object.entries(t).forEach(([k,v])=>{if(k!=='font')r.style.setProperty('--'+k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase()),v)});document.body.style.fontFamily=t.font==='serif'?'Fraunces,serif':t.font==='system'?'system-ui,sans-serif':'IBM Plex Sans,sans-serif';if(save)localStorage.setItem('planning_theme',JSON.stringify(t));document.getElementById('colorBg').value=t.bg;document.getElementById('colorSurface').value=t.surface;document.getElementById('colorInk').value=t.ink;document.getElementById('colorAccent').value=t.accent;document.getElementById('colorToday').value=t.today;document.getElementById('themeFont').value=t.font}
const storedTheme=localStorage.getItem('planning_theme');applyTheme(storedTheme?{...DEFAULT_THEME,...JSON.parse(storedTheme)}:DEFAULT_THEME,false);document.getElementById('themePreset').addEventListener('change',e=>applyTheme(e.target.value==='dark'?DARK_THEME:DEFAULT_THEME));document.getElementById('resetThemeBtn').addEventListener('click',()=>{localStorage.removeItem('planning_theme');applyTheme(DEFAULT_THEME)});document.querySelectorAll('#themeDetails input[type=color],#themeFont').forEach(e=>e.addEventListener('input',()=>{const t={...DEFAULT_THEME,bg:colorBg.value,surface:colorSurface.value,ink:colorInk.value,accent:colorAccent.value,today:colorToday.value,font:themeFont.value};applyTheme(t)}));
function getCustomEvents(){return JSON.parse(localStorage.getItem('planning_customEvents')||'[]')}function saveCustomEvents(e){localStorage.setItem('planning_customEvents',JSON.stringify(e))}function customEventsToObjects(){return getCustomEvents().map(e=>{const d=new Date(e.date),[h,m]=e.startTime.split(':'),[eh,em]=e.endTime.split(':');return{start:new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m),end:new Date(d.getFullYear(),d.getMonth(),d.getDate(),eh,em),summary:e.summary,location:e.location,custom:true,id:e.id}})}
function buildTargets(url,proxy){const targets=[{label:'URL directe',target:url}];if(proxy)targets.push({label:'proxy personnel',target:proxy+encodeURIComponent(url)});return targets}async function fetchICS(url,proxy,onAttempt){let lastError=null;for(const{label,target}of buildTargets(url,proxy)){try{onAttempt(label);const r=await fetch(target,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();if(!text.includes('BEGIN:VCALENDAR'))throw Error('Réponse ICS invalide');return text}catch(e){lastError=e}}throw lastError||Error('Échec du chargement')}
function expandEvents(text,start,end){const c=new ICAL.Component(ICAL.parse(text)),out=[];c.getAllSubcomponents('vevent').forEach(v=>{const e=new ICAL.Event(v),s=e.startDate.toJSDate(),en=e.endDate.toJSDate();if(s<=end&&en>=start)out.push({start:s,end:en,summary:e.summary||'Sans titre',location:e.location||'',description:e.description||''})});return out.sort((a,b)=>a.start-b.start)}function render(events){agendaEl.innerHTML='';if(!events.length){agendaEl.innerHTML='<div class="empty">Aucun événement dans la période affichée.</div>';return}let day=null,wrap;const today=new Date();events.forEach(e=>{const d=e.start;if(!day||day.toDateString()!==d.toDateString()){day=d;const block=document.createElement('div');block.className='day-block'+(day.toDateString()===today.toDateString()?' today':'');block.innerHTML='<div class="day-label"><div class="day-num">'+d.getDate()+'</div><div class="day-name">'+d.toLocaleDateString('fr-FR',{weekday:'short',month:'short'})+'</div></div><div class="events"></div>';agendaEl.appendChild(block);wrap=block.querySelector('.events')}const el=document.createElement('div');el.className='event'+(e.custom?' custom':'');el.innerHTML='<div class="event-time">'+e.start.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' – '+e.end.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</div><div class="event-title"></div>'+(e.location?'<div class="event-meta"></div>':'');el.querySelector('.event-title').textContent=e.summary;if(e.location)el.querySelector('.event-meta').textContent=e.location;wrap.appendChild(el)})}
async function load(){const url=urlInput.value.trim(),proxy=document.getElementById('customProxy').value.trim();if(!url){setStatus('Colle une URL ICS ci-dessus.',true);return}localStorage.setItem('planning_icsUrl',url);if(proxy)localStorage.setItem('planning_customProxy',proxy);try{const text=await fetchICS(url,proxy,l=>setStatus('Tentative : '+l));const n=new Date(),start=new Date(n.getFullYear(),n.getMonth(),n.getDate()),end=new Date(n.getFullYear(),n.getMonth(),n.getDate()+60),events=[...expandEvents(text,start,end),...customEventsToObjects()].filter(e=>e.start<=end&&e.end>=start).sort((a,b)=>a.start-b.start);render(events);setStatus(events.length+' événement(s) affiché(s).')}catch(e){setStatus('Erreur de chargement : '+e.message,true)}}
function loadCustom(){const n=new Date(),start=new Date(n.getFullYear(),n.getMonth(),n.getDate()),end=new Date(n.getFullYear(),n.getMonth(),n.getDate()+60);render(customEventsToObjects().filter(e=>e.start<=end&&e.end>=start));}
document.getElementById('loadBtn').addEventListener('click',load);document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.removeItem('planning_icsUrl');urlInput.value='';agendaEl.innerHTML='';setStatus('Lien oublié. Colle un nouveau lien ICS pour recharger.')});document.getElementById('addEventForm').addEventListener('submit',e=>{e.preventDefault();const date=eventDate.value,startTime=eventStart.value,endTime=eventEnd.value,summary=eventName.value.trim(),location=eventLocation.value.trim();const events=getCustomEvents();events.push({id:Date.now().toString(),date,startTime,endTime,summary,location});saveCustomEvents(events);e.target.reset();load()});
const savedUrl=localStorage.getItem('planning_icsUrl'),savedProxy=localStorage.getItem('planning_customProxy');if(savedProxy)document.getElementById('customProxy').value=savedProxy;if(savedUrl){urlInput.value=savedUrl;load()}else{loadCustom();setStatus('Colle ton lien ICS du planning UBS ci-dessus.')}
</script></body></html>
